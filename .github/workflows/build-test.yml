name: build test

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-webots:main
      options: --user 0

    steps:
    - uses: actions/checkout@v4
    - name: init submodule
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && git submodule update --init --recursive
    - name: install pip packages
      run: pip install xrobot
    - name: install linux build deps
      run: |
        apt-get update
        apt-get install -y --no-install-recommends libgpiod-dev
    - name: get modules && setup
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' > /tmp/xrobot_module_clone_list.tsv
        import yaml

        with open("Modules/modules.yaml", "r", encoding="utf-8") as f:
            modules = yaml.safe_load(f)["modules"]

        for entry in modules:
            namespace, rest = entry.split("/", 1)
            if "@" in rest:
                module, ref = rest.split("@", 1)
            else:
                module, ref = rest, "master"
            if namespace in {"qdu-future", "qdu-robomaster"}:
                org = "QDU-Robomaster"
            elif namespace == "xrobot-org":
                org = "xrobot-org"
            else:
                raise SystemExit(f"unknown module namespace: {namespace}")
            print(f"{module}\thttps://github.com/{org}/{module}.git\t{ref}")
        PY
        while IFS=$'\t' read -r module url ref; do
          rm -rf "Modules/${module}"
          if [[ "${ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git init "Modules/${module}"
            git -C "Modules/${module}" remote add origin "${url}"
            git -C "Modules/${module}" fetch --depth=1 origin "${ref}"
            git -C "Modules/${module}" checkout --detach FETCH_HEAD
            git -C "Modules/${module}" submodule update --init --recursive --depth=1
          else
            git clone --depth=1 --recurse-submodules --branch "${ref}" "${url}" "Modules/${module}"
          fi
        done </tmp/xrobot_module_clone_list.tsv
    - name: test calibration preview config contracts
      run: python3 tests/calibration_preview_config_test.py
    - name: generate intrinsic calibration preset
      run: python3 -m xrobot.GenerateMain --config User/RunConfig/camera_intrinsic_calibration.yaml --output User/xrobot_main.hpp
    - name: config cmake intrinsic calibration
      run: >
        cmake . -Bbuild_calibration_intrinsic -G Ninja
        -DBUILD_TESTING=OFF
        -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON
        -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON
        -DLIBXR_PRINT_ENABLE_POINTER=ON
    - name: build intrinsic calibration
      run: cmake --build build_calibration_intrinsic --target rm_auto_aim
    - name: generate handeye calibration preset
      run: python3 -m xrobot.GenerateMain --config User/RunConfig/camera_extrinsic_calibration.yaml --output User/xrobot_main.hpp
    - name: config cmake handeye calibration
      run: >
        cmake . -Bbuild_calibration_handeye -G Ninja
        -DBUILD_TESTING=OFF
        -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON
        -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON
        -DLIBXR_PRINT_ENABLE_POINTER=ON
    - name: build handeye calibration
      run: cmake --build build_calibration_handeye --target rm_auto_aim
    - name: generate capturefile preset
      run: xrobot_gen_main --config User/RunConfig/capturefile.yaml --output User/xrobot_main.hpp
    - name: config cmake capturefile
      run: >
        cmake . -Bbuild_capturefile -G Ninja
        -DBUILD_TESTING=ON
        -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON
        -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON
        -DLIBXR_PRINT_ENABLE_POINTER=ON
    - name: build capturefile
      run: cmake --build build_capturefile
    - name: test capturefile geometry contracts
      run: >-
        ctest --test-dir build_capturefile/libxr --output-on-failure
        --no-tests=error
    - name: generate hik preset
      run: xrobot_gen_main --config User/RunConfig/hik.yaml --output User/xrobot_main.hpp
    - name: config cmake hik
      run: >
        cmake . -Bbuild_hik -G Ninja
        -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON
        -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON
        -DLIBXR_PRINT_ENABLE_POINTER=ON
    - name: build hik
      run: cmake --build build_hik --target rm_auto_aim
