name: build test

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-webots:main
      options: --user 0

    steps:
    - uses: actions/checkout@v4
    - name: init submodule
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && git submodule update --init --recursive
    - name: install pip packages
      run: pip install xrobot
    - name: install linux build deps
      run: |
        apt-get update
        apt-get install -y --no-install-recommends libgpiod-dev
    - name: get modules && setup
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' > /tmp/xrobot_module_clone_list.tsv
        import yaml

        with open("Modules/modules.yaml", "r", encoding="utf-8") as f:
            modules = yaml.safe_load(f)["modules"]

        for entry in modules:
            namespace, rest = entry.split("/", 1)
            if "@" in rest:
                module, ref = rest.split("@", 1)
            else:
                module, ref = rest, "master"
            if namespace in {"qdu-future", "qdu-robomaster"}:
                org = "QDU-Robomaster"
            elif namespace == "xrobot-org":
                org = "xrobot-org"
            else:
                raise SystemExit(f"unknown module namespace: {namespace}")
            print(f"{module}\thttps://github.com/{org}/{module}.git\t{ref}")
        PY
        while IFS=$'\t' read -r module url ref; do
          rm -rf "Modules/${module}"
          git clone --depth=1 --recurse-submodules --branch "${ref}" "${url}" "Modules/${module}"
        done </tmp/xrobot_module_clone_list.tsv
    - name: detect OpenVINO
      shell: bash
      run: |
        set -euo pipefail
        openvino_dir=""
        for root in /opt /usr/local /usr; do
          openvino_dir="$(find "$root" -type d -path '*/runtime/cmake' -print -quit 2>/dev/null || true)"
          if [ -n "$openvino_dir" ]; then
            break
          fi
        done
        if [ -z "$openvino_dir" ]; then
          echo "OpenVINO runtime CMake directory not found" >&2
          exit 1
        fi
        echo "OPENVINO_DIR=$openvino_dir" >> "$GITHUB_ENV"
    - name: generate capturefile preset
      run: xrobot_gen_main --config User/RunConfig/capturefile.yaml --output User/xrobot_main.hpp
    - name: config cmake capturefile
      run: >
        cmake . -Bbuild_capturefile -G Ninja
        -DOpenVINO_DIR="$OPENVINO_DIR"
        -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON
        -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON
        -DLIBXR_PRINT_ENABLE_POINTER=ON
    - name: build capturefile
      run: cmake --build build_capturefile --target rm_auto_aim
    - name: generate hik preset
      run: xrobot_gen_main --config User/RunConfig/hik.yaml --output User/xrobot_main.hpp
    - name: config cmake hik
      run: >
        cmake . -Bbuild_hik -G Ninja
        -DOpenVINO_DIR="$OPENVINO_DIR"
        -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON
        -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON
        -DLIBXR_PRINT_ENABLE_POINTER=ON
    - name: build hik
      run: cmake --build build_hik --target rm_auto_aim
    - name: generate vision_capture preset
      run: xrobot_gen_main --config User/RunConfig/vision_capture.yaml --output User/xrobot_main.hpp
    - name: config cmake vision_capture
      run: >
        cmake . -Bbuild_vision_capture -G Ninja
        -DOpenVINO_DIR="$OPENVINO_DIR"
        -DLIBXR_PRINT_INTEGER_ENABLE_64BIT=ON
        -DLIBXR_PRINT_FLOAT_ENABLE_DOUBLE=ON
        -DLIBXR_PRINT_ENABLE_POINTER=ON
    - name: build vision_capture
      run: cmake --build build_vision_capture --target rm_auto_aim
