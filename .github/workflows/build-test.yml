name: build test

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-webots:main
      options: --user 0

    steps:
    - uses: actions/checkout@v4
    - name: init submodule
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && git submodule update --init --recursive
    - name: Checkout matching XRobot tools
      shell: bash
      run: |
        set -euo pipefail
        selected="${XROBOT_REF:-}"
        if [[ -z "$selected" ]]; then
          if [[ -n "$(git ls-remote --heads https://github.com/xrobot-org/XRobot.git "refs/heads/$XR_REF_NAME")" ]]; then
            selected="refs/heads/$XR_REF_NAME"
          else
            selected=refs/heads/dev
          fi
        fi
        git init .ci-tools/XRobot
        git -C .ci-tools/XRobot remote add origin https://github.com/xrobot-org/XRobot.git
        git -C .ci-tools/XRobot fetch --depth=1 origin "$selected"
        git -C .ci-tools/XRobot checkout --detach FETCH_HEAD
        python3 -m pip install ./.ci-tools/XRobot
    - name: install linux build deps
      run: |
        apt-get update
        apt-get install -y --no-install-recommends libgpiod-dev
    - name: Resolve configured modules and generate the hardware entry
      run: xrobot_setup --context-ref "refs/heads/$XR_REF_NAME" --register-source User/main.cpp
    - name: detect optional OpenVINO
      shell: bash
      run: |
        set -euo pipefail
        openvino_dir=""
        for root in /opt /usr/local /usr; do
          openvino_dir="$(find "$root" -type d -path '*/runtime/cmake' -print -quit 2>/dev/null || true)"
          if [ -n "$openvino_dir" ]; then
            break
          fi
        done
        if [ -z "$openvino_dir" ]; then
          echo "OpenVINO not found; continuing without the optional dependency"
        fi
        echo "OPENVINO_DIR=$openvino_dir" >> "$GITHUB_ENV"
    - name: configure Release
      shell: bash
      run: |
        args=()
        if [ -n "${OPENVINO_DIR:-}" ]; then
          args+=("-DOpenVINO_DIR=$OPENVINO_DIR")
        fi
        cmake --preset release -DBUILD_TESTING=OFF "${args[@]}"
    - name: build replay entry
      run: |
        xrobot_gen_main --config User/Replay/xrobot.yaml --output User/Replay/xrobot_main.hpp --register-source User/Replay/main.cpp
        cmake --build --preset release --target rm_auto_aim_replay -j2
    - name: build every hardware run config
      shell: bash
      run: |
        set -euo pipefail
        for config in User/xrobot.yaml User/RunConfig/*.yaml; do
          xrobot_gen_main --config "$config" --output User/xrobot_main.hpp --register-source User/main.cpp
          cmake --build --preset release --target rm_auto_aim -j2
        done
    env:
      XR_REF_NAME: ${{ github.head_ref || github.ref_name }}
      XROBOT_REF: ${{ vars.XROBOT_REF || '' }}
