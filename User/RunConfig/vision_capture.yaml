modules:
  - module: QDU-Robomaster/HikCamera
    id: camera
    template_args:
      - 'AutoAimRunConfig::VisionCapture::HikFrameLayout'
    args:
      - ramfs: ramfs
      - calibration: 'AutoAimRunConfig::VisionCapture::MainCameraCalibration'
      - runtime:
          - '"gimbal"'  # camera_name
          - '"camera_image"' # image_topic_name
          - '"camera_imu"' # imu_topic_name
          - '16.0F' # gain
          - 'AutoAimRunConfig::VisionCapture::HikExposureTimeUs' # exposure_time
          - true # external_trigger
          - '249.0F' # acquisition_frame_rate
          - 100 # grab_timeout_ms
          - 3 # image_node_num
          - 2 # decimation_horizontal
          - 2 # decimation_vertical
          - false # rotate_180
  - module: QDU-Robomaster/CameraFrameSync
    id: camera_frame_sync
    template_args:
      - 'AutoAimRunConfig::VisionCapture::HikFrameLayout'
    args:
      - camera: camera
      - runtime:
          - 'CameraFrameSync<AutoAimRunConfig::VisionCapture::HikFrameLayout>::SyncMode::RAW_PROBE'  # mode
          - 'AutoAimRunConfig::VisionCapture::HikSyncOffsetUs' # offset_us
          - '"host"' # host_topic_domain_name
          - '"camera_sync_command"' # sync_command_topic_name
          - '"camera_sync_result"' # sync_result_topic_name
          - 3 # sync_probe_div
          - 1 # sync_active_level
          - '100.0F' # target_trigger_hz
  - module: xrobot-org/SharedTopic
    id: shared_topic_rx
    args:
      - uart: devc_usb
      - ramfs: ramfs
      - uart_name: '"DevC-USB"'
      - buffer_size: 4096
      - topic_configs:
          - ['"gimbal_gyro"', '"host"']
          - ['"gimbal_accl"', '"host"']
          - ['"gimbal_quat"', '"host"']
          - ['"camera_sync_result"', '"host"']

  - module: xrobot-org/SharedTopicClient
    id: shared_topic_tx
    args:
      - uart: devc_usb
      - slot_count: 256
      - topic_configs:
          - ['"camera_sync_command"', '"host"']

  - module: QDU-Robomaster/VisionCapture
    id: vision_capture
    template_args:
      - 'AutoAimRunConfig::VisionCapture::HikFrameLayout'
    args:
      - sync: camera_frame_sync
      - cfg:
          - '"record"'  # mode
          - '"runs/vision_capture"' # output_dir
          - '"hik_capture"' # session_name
          - # record
            enabled: true
            image_format: '"bmp"'
            max_fps: 30.0
            max_frames: 0
            save_images: true
            save_metadata: true
            save_raw_imu: true
            flush_every_n: 1
          - # preview
            enabled: true
            preview_window_name: '"vision_capture"'
            preview_scale: 0.5
            preview_wait_key_ms: 1
            queue_capacity: 1
            output_mode: '"web"'
            web_bind_address: '"0.0.0.0"'
            web_port: 8080
            web_stream_name: '"vision_capture"'
            max_fps: 30.0
          - # board
            type: '"aruco"'
            dictionary: '"DICT_5X5_100"'
            marker_length_m: 0.04
          - # camera_calibration
            enabled: true
            marker_size_mm: 25.0
            cols: 8
            rows: 6
            auto_save_views: 120
          - # filter
            require_synced_imu: true
            max_image_imu_dt_us: 2000
settings:
  monitor_sleep_ms: '1000'
