modules:
  - module: QDU-Robomaster/HikCamera
    id: camera
    template_args:
      - 'AutoAimRunConfig::Sentry::HikFrameLayout'
    args:
      - ramfs: ramfs
      - calibration: 'AutoAimRunConfig::Sentry::MainCameraCalibration'
      - runtime:
          - '"gimbal"'  # camera_name
          - '"camera_image"' # image_topic_name
          - '"camera_imu"' # imu_topic_name
          - '16.0F' # gain
          - 'AutoAimRunConfig::Sentry::HikExposureTimeUs' # exposure_time
          - false # external_trigger
          - '124.5F' # acquisition_frame_rate
          - 100 # grab_timeout_ms
          - 3 # image_node_num
          - 2 # decimation_horizontal
          - 2 # decimation_vertical
          - false # rotate_180
  - module: QDU-Robomaster/CameraFrameSync
    id: camera_frame_sync
    template_args:
      - 'AutoAimRunConfig::Sentry::HikFrameLayout'
    args:
      - camera: camera
      - runtime:
          - 'CameraFrameSync<AutoAimRunConfig::Sentry::HikFrameLayout>::SyncMode::LATEST_IMU'  # mode
          - 'AutoAimRunConfig::Sentry::HikSyncOffsetUs' # offset_us
          - '"host"' # host_topic_domain_name
          - '"camera_sync_command"' # sync_command_topic_name
          - '"camera_sync_result"' # sync_result_topic_name
          - 3 # sync_probe_div
          - 1 # sync_active_level
          - '100.0F' # target_trigger_hz
          - 'CameraFrameSync<AutoAimRunConfig::Sentry::HikFrameLayout>::RawImuFrame::X_FORWARD_Y_LEFT_Z_UP_TO_BODY' # raw_imu_frame
          - '"ahrs_quaternion"' # raw_quat_topic_name
  - module: xrobot-org/SharedTopic
    id: shared_topic_rx
    args:
      - uart: devc_usb
      - ramfs: ramfs
      - uart_name: '"DevC-USB"'
      - buffer_size: 256
      - topic_configs:
          - ['"ahrs_quaternion"', '"host"']
          - ['"camera_sync_result"', '"host"']
          - ['"robot_game_ref"', '"host"']

  - module: QDU-Robomaster/ArmorDetector
    id: armor_detector
    template_args:
      - 'AutoAimRunConfig::Sentry::HikFrameLayout'
    args:
      - sync: camera_frame_sync
      - cfg:
          detect_color: 2
          network:
            model: 'ArmorDetectorModel::INT16_HEAD_L'
            min_confidence: 0.1
            enable_quad_check: true
            min_quad_area_px: 16.0
          referee_auto_detect_color: true
          referee_domain: '"host"'
          preview:
            enabled: false
            preview_window_name: '"armor_detector_preview"'
            preview_scale: 0.5
            preview_wait_key_ms: 1
            queue_capacity: 1
            output_mode: '"web"'
            web_bind_address: '"0.0.0.0"'
            web_port: 8081
            web_stream_name: '"armor_detector"'
            max_fps: 30.0
          number_refine:
            enabled: true
            detector_min_confidence: 0.2
            classifier_min_confidence: 0.9
            enforce_type_compatibility: true
  - module: QDU-Robomaster/ArmorTracker
    id: armor_tracker
    template_args:
      - 'AutoAimRunConfig::Sentry::HikFrameLayout'
    args:
      - ramfs: ramfs
      - sync: camera_frame_sync
      - cfg:
          tracker:
            require_target_tag: false
            target_tag_id: -1
            min_detect_count: 2
            max_temp_lost_count: 15
            outpost_max_temp_lost_count: 75
            target_select:
              observed_count_weight: 1.6
              distance_weight: 2.0
              area_weight: 1.2
              spin_weight: 0.8
              angle_weight: 2.0
              max_distance_m: 8.0
              distance_span_m: 7.5
              area_norm_px: 6000.0
              observed_count_norm: 4.0
              max_spin_rad_s: 8.0
              max_angle_norm: 0.5
              detecting_scale: 0.55
              temp_lost_scale: 0.35
              switch_margin: 0.25
          extrinsic:
            camera_mount_to_body:
              rotation: [1.0, 0.0, 0.0, 0.0]
              translation: [0.0, 0.115, 0.05]
          preview:
            enabled: false
            preview_window_name: '"armor_tracker_preview"'
            preview_scale: 0.5
            preview_wait_key_ms: 1
            queue_capacity: 1
            output_mode: '"web"'
            web_bind_address: '"0.0.0.0"'
            web_port: 8082
            web_stream_name: '"armor_tracker"'
            max_fps: 30.0
  - module: QDU-Robomaster/Aimer
    id: aimer
    template_args:
      - 'AutoAimRunConfig::Sentry::HikFrameLayout'
    args:
      - cfg:
          yaw_offset: -0.4
          roll_offset: -1.6
          yaw_rate_threshold: 2.0
          default_bullet_speed: 21.0
          min_valid_bullet_speed: 14.0
          ballistic_drag_k: 0.02
          ballistic_integration_dt_s: 0.001
          ballistic_max_iterations: 16
          ballistic_min_elevation_deg: -20.0
          ballistic_max_elevation_deg: 35.0
          auto_fire: true
          image_to_now_s: 0.0
          vision_to_command_delay_s: 0.0
          command_transport_delay_s: 0.0
          gimbal_response_delay_s: 0.0
          fire_delay_s: 0.05
          low_speed_extra_predict_s: 0.075
          high_speed_extra_predict_s: 0.075
          min_fire_threshold: 0.06
          max_fire_threshold: 0.48
          enable_mpc_plan: true
          mpc_fire_thresh: 0.48
          max_yaw_acc: 50.0
          q_yaw_pos: 9000000.0
          q_yaw_vel: 0.0
          r_yaw_acc: 1.0
          max_roll_acc: 100.0
          q_roll_pos: 9000000.0
          q_roll_vel: 0.0
          r_roll_acc: 1.0
          preview:
            enabled: true
            preview_window_name: '"aimer_preview"'
            preview_scale: 0.5
            preview_wait_key_ms: 1
            queue_capacity: 1
            output_mode: '"web"'
            web_bind_address: '"0.0.0.0"'
            web_port: 8083
            web_stream_name: '"aimer_preview"'
            max_fps: 30.0
          enable_runtime_log: true
          bullet_speed_log_delta: 0.05
          heat_log_delta: 1.0
          convert_raw_gimbal_quat_to_body: true
      - calibration: 'AutoAimRunConfig::Sentry::MainCameraCalibration'
  - module: xrobot-org/SharedTopicClient
    id: shared_topic_tx
    args:
      - uart: devc_usb
      - slot_count: 16
      - topic_configs:
          - ['"target_euler"', '"host"']
          - ['"fire_notify"', '"host"']
settings:
  monitor_sleep_ms: '1000'
