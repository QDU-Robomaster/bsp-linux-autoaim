modules:
  - id: armor_detector
    name: ArmorDetector
    template_args:
      Info:
        constexpr: MainCameraInfo
    constructor_args:
      cfg:
        detect_color: 2
        network:
          model: {expr: ArmorDetectorModel::INT8_HEAD_L}
          min_confidence: 0.1
          enable_quad_check: true
          min_quad_area_px: 16.0
          logit_threshold: 0.1
          nms_threshold: 0.45
          bbox_expand: 0.1
          max_detections: 128
        referee_auto_detect_color: false
        referee_domain: host
        referee_topic: robot_game_ref
        preview:
          enabled: false
          preview_window_name: armor_detector_preview
          preview_scale: 0.5
          preview_wait_key_ms: 1
          queue_capacity: 1
          output_mode: window
          web_bind_address: 0.0.0.0
          web_port: 8080
          web_stream_name: armor_detector
          max_fps: 30.0
      sync: "@camera_frame_sync"
