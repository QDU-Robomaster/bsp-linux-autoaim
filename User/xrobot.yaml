constexpr_namespace: AutoAimRunConfig
constexpr_includes:
  - CameraBase.hpp
constexprs:
  ExposureUs:
    type: float
    value: 2000.0F
  # 触发沿到曝光开始的延迟 / Delay from the trigger edge to the start of exposure
  TriggerDelayUs:
    type: int
    value: 75
  # 触发沿到曝光中点 / Trigger edge to mid-exposure
  SyncOffsetUs:
    type: int
    value: TriggerDelayUs + static_cast<int>(ExposureUs * 0.5F)
  MainCameraCalibration:
    type: CameraTypes::CameraCalibration
    value: '{.native_width = 1440, .native_height = 1080, .fx = 2328.685719898089, .fy = 2328.670107789996, .cx = 733.3564625092474, .cy = 540.6187286922773, .distortion = {-0.09182103918709904, 0.4639907346830205, 0.002609878642637282, 0.0009819586010405485, -0.4751278850310457}}'
modules:
  - module: QDU-Robomaster/HikCamera
    id: camera
    args:
      - calibration: AutoAimRunConfig::MainCameraCalibration
      - narrow:
          u: 0.5
          v: 0.5
      - name: "gimbal"
      - settings:
          exposure_us: AutoAimRunConfig::ExposureUs
          # ADC8 比 ADC12 快（241 对 88 fps）；增益比原 16 dB 降约 12 dB，以免灯条过曝（未实测）
          # ADC8 is faster than ADC12 (241 vs 88 fps); gain about 12 dB below the old 16 dB
          # keeps the light bars from saturating (not yet measured)
          gain_db: 4.0F
          adc_bits: 8
          external_trigger: true
          free_run_fps: 200.0F
  - module: QDU-Robomaster/CameraFrameSync
    id: camera_frame_sync
    args:
      - camera: camera
      - settings:
          mode: SyncMode::TRIGGER
          trigger_period_us: 5000
          offset_us: AutoAimRunConfig::SyncOffsetUs
          mcu_domain: "host"
          gyro_topic: "gimbal_gyro"
          accl_topic: "gimbal_accl"
          quat_topic: "gimbal_quat"
          imu_axes: ImuAxes::BODY
  - module: QDU-Robomaster/ArmorDetector
    id: armor_detector
    args:
      - settings:
          camera_name: "gimbal"
          model_dir: "armor-models/model_private"
          detector_model: "armor_det_v7.hef"
          number_model: "armor_num_v1.onnx"
          openvino_device: "CPU"
          min_confidence: 0.4F
          nms_iou: 0.3F
          inflight: 1
  - module: QDU-Robomaster/ArmorTracker
    id: armor_tracker
    args:
      - settings:
          camera_name: "gimbal"
          mount_rotation_wxyz: [0.999929746909, -0.009747410407, -0.004716638126, -0.004821053970]
          mount_translation: [0.041861764663827829, 0.136068364765315, 0.0089956658836358675]
          target_number: -1
          target_color: TargetColor::FROM_REFEREE
          min_detect_s: 0.02
          max_temp_lost_s: 0.15
          outpost_max_temp_lost_s: 0.75
          off_hold_s: 0.2
          off_dead_s: 1.0
          latency_s: 0.07
          bullet_speed: 21.7
          select:
            observed_count_weight: 1.6
            distance_weight: 2.0
            area_weight: 1.2
            spin_weight: 0.8
            angle_weight: 2.0
            max_distance_m: 8.0
            distance_span_m: 7.5
            area_norm_px: 24000.0
            observed_count_norm: 4.0
            max_spin_rad_s: 8.0
            max_angle_rad: 0.3
            temp_lost_scale: 0.35
            switch_margin: 0.25
  - module: QDU-Robomaster/Aimer
    id: aimer
    args:
      - camera_name: "gimbal"
      - cfg:
          yaw_offset: 0.0
          roll_offset: 0.6
          yaw_rate_threshold: 2.0
          default_bullet_speed: 21.7
          min_valid_bullet_speed: 14.0
          referee_bullet_speed: true
          bullet_speed_window: 9
          bullet_speed_min_samples: 3
          max_valid_bullet_speed: 35.0
          bullet_speed_outlier_m_s: 0.5
          ballistic_drag_k: 0.02
          ballistic_integration_dt_s: 0.001
          ballistic_max_iterations: 16
          ballistic_min_elevation_deg: -20.0
          ballistic_max_elevation_deg: 35.0
          auto_fire: true
          image_to_now_s: 0.0
          vision_to_command_delay_s: 0.0
          command_transport_delay_s: 0.0
          gimbal_response_delay_s: 0.0
          fire_delay_s: 0.05
          low_speed_extra_predict_s: 0.075
          high_speed_extra_predict_s: 0.075
          min_fire_threshold: 0.06
          max_fire_threshold: 0.48
          enable_mpc_plan: true
          mpc_fire_thresh: 0.48
          max_yaw_acc: 50.0
          q_yaw_pos: 9000000.0
          q_yaw_vel: 0.0
          r_yaw_acc: 1.0
          max_roll_acc: 100.0
          q_roll_pos: 9000000.0
          q_roll_vel: 0.0
          r_roll_acc: 1.0
          enable_runtime_log: true
          bullet_speed_log_delta: 0.05
          heat_log_delta: 1.0
          convert_raw_gimbal_quat_to_body: false
          referee_topic: "robot_game_ref"
          heat_aware_fire: false
          heat_fire_p_low: 0.55
          heat_fire_p_high: 0.85
          heat_fire_p_floor: 0.3
          heat_fire_relax_s: 0.5
          heat_fire_sigma_m: 0.01
          heat_fire_phase_sigma_rad_s: 0.7
          heat_fire_horizon_extra_s: 0.05
          heat_fire_shot_heat: 10.0
          heat_fire_min_interval_s: 0.05
          heat_fire_gimbal_error_gain: 0.65
          heat_fire_rate_bias_s: 0.01
          heat_fire_rate_spread_s: 0.01
          referee_heat: true
          referee_heat_timeout_s: 0.5
          referee_heat_window_s: 0.15
          referee_heat_42mm: false
          referee_cooling_add_buff: false
          lead_calibration: false
          lead_calibration_batches: 5
          lead_calibration_max_adjust_s: 0.05
          lead_calibration_monitor_threshold_s: 0.003
          lead_calibration_monitor_batches: 3
          lead_calibration_max_distance_m: 4.0
  - module: QDU-Robomaster/VisionPreview
    id: preview
    args:
      - settings:
          camera_name: "gimbal"
          port: 8080
          fresh_ms: 100
  - module: QDU-Robomaster/VisionRecorder
    id: recorder
    args:
      - settings:
          camera_name: "gimbal"
          # 打开后每次启动在 output_dir 下录一个目录 / When on, each start records a directory
          record: false
          output_dir: "recordings"
          max_fps: 0.0
          max_frames: 0
          buffer_frames: 32
  - module: xrobot-org/SharedTopic
    id: shared_topic_rx
    args:
      - uart: devc_usb
      - ramfs: ramfs
      - uart_name: "DevC-USB"
      - buffer_size: 4096
      - topic_configs:
          - ["gimbal_gyro", "host"]
          - ["gimbal_accl", "host"]
          - ["gimbal_quat", "host"]
          - ["camera_sync_result", "host"]
          - ["robot_game_ref", "host"]
  - module: xrobot-org/SharedTopicClient
    id: shared_topic_tx
    args:
      - uart: devc_usb
      - slot_count: 256
      - topic_configs:
          - ["target_euler", "host"]
          - ["fire_notify", "host"]
          - ["camera_sync_command", "host"]
settings:
  monitor_sleep_ms: 1000
